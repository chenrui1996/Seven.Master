<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Seven Master 敏捷开发框架" />
    <title>Seven Master · 敏捷开发框架</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('theme');
          var mode = 'system';
          if (raw) {
            var p = JSON.parse(raw);
            if (p.mode === 'light' || p.mode === 'dark' || p.mode === 'system') mode = p.mode;
          }
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.sevenTheme = dark ? 'dark' : 'light';
        } catch (e) {}
        try {
          var localeRaw = localStorage.getItem('locale');
          var lang = 'zh-CN';
          if (localeRaw) {
            var lp = JSON.parse(localeRaw);
            if (lp.locale) lang = lp.locale;
          }
          document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
