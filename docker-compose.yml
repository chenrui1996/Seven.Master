services:
  seven-api:
    build:
      context: ./Seven.Net8
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      Database__Provider: MySql
      Database__ConnectionString: "Server=mysql;Database=seven;User=root;Password=seven123;"
      Cache__Provider: Redis
      Cache__RedisConnectionString: "redis:6379"
      MessageQueue__Provider: RabbitMQ
      MessageQueue__RabbitMq__Host: rabbitmq
      MessageQueue__RabbitMq__Port: 5672
      MessageQueue__RabbitMq__Username: guest
      MessageQueue__RabbitMq__Password: guest
      Jwt__Secret: "SevenMasterJwtSecretKey2026MustBe32Chars!"
      Cors__Origins: "http://localhost:5173"
      MinIO__Enabled: "true"
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: "minioadmin"
      MinIO__SecretKey: "minioadmin"
      MinIO__Bucket: "seven"
      Database__MigrateOnStartup: "true"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - minio

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: seven123
      MYSQL_DATABASE: seven
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
