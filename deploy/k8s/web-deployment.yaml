apiVersion: v1
kind: ConfigMap
metadata:
  name: seven-web-nginx
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://seven-api:80/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /hub/ {
            proxy_pass http://seven-api:80/hub/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seven-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seven-web
  template:
    metadata:
      labels:
        app: seven-web
    spec:
      containers:
        - name: web
          image: seven-web:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: seven-web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: seven-web
spec:
  selector:
    app: seven-web
  ports:
    - port: 80
      targetPort: 80
