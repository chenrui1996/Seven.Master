apiVersion: v1
kind: ConfigMap
metadata:
  name: seven-api-config
data:
  Database__Provider: MySql
  Cache__Provider: Redis
  MessageQueue__Provider: None
  Tenant__Enabled: "false"
  Security__CaptchaEnabled: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: seven-api-secret
type: Opaque
stringData:
  Database__ConnectionString: "Server=mysql;Database=seven;User=root;Password=seven123;"
  Cache__RedisConnectionString: "redis:6379"
  Jwt__Secret: "SevenMasterJwtSecretKey2026MustBe32Chars!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seven-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seven-api
  template:
    metadata:
      labels:
        app: seven-api
    spec:
      containers:
        - name: api
          image: seven-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: seven-api-config
            - secretRef:
                name: seven-api-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: seven-api
spec:
  selector:
    app: seven-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seven-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: seven.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: seven-api
                port:
                  number: 80
          - path: /hub
            pathType: Prefix
            backend:
              service:
                name: seven-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seven-web
                port:
                  number: 80
