<template>
  <div class="crud-page seven-page">
    <div class="seven-page-header">
      <div>
        <h1 class="seven-page-title">{{Title}}</h1>
      </div>
    </div>
    <el-card>
      <template #header>
        <div class="toolbar">
          <span>{{Title}}</span>
          <el-button v-permission="'{{TableName}}.Add'" type="primary" @click="openForm()">新增</el-button>
        </div>
      </template>
      <el-table :data="tableData" v-loading="loading" border>
        {{TableColumns}}
        <el-table-column label="操作" width="120">
          <template #default="{ row }">
            <el-button v-permission="'{{TableName}}.Update'" link type="primary" @click="openForm(row)">编辑</el-button>
          </template>
        </el-table-column>
      </el-table>
      <el-pagination v-model:current-page="page" :total="total" @change="loadData" style="margin-top:16px" />
    </el-card>
    <el-dialog v-model="dialogVisible" title="编辑" width="520px">
      <el-form :model="form" label-width="100px">
        {{FormItems}}
      </el-form>
      <template #footer>
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" @click="save">确定</el-button>
      </template>
    </el-dialog>
  </div>
</template>

<script setup lang="ts">
import { onMounted, reactive, ref } from 'vue'
import { ElMessage } from 'element-plus'
import http, { getPageData } from '../../api/http'

const loading = ref(false)
const tableData = ref<Record<string, unknown>[]>([])
const total = ref(0)
const page = ref(1)
const dialogVisible = ref(false)
const form = reactive<Record<string, unknown>>({ {{FormFields}} })

async function loadData() {
  loading.value = true
  try {
    const res = await getPageData('/api/{{ApiRoute}}/getPageData', { page: page.value, rows: 30 })
    if (res.status && res.data) {
      const data = res.data as { total: number; rows: Record<string, unknown>[] }
      total.value = data.total
      tableData.value = data.rows
    }
  } finally { loading.value = false }
}

function openForm(row?: Record<string, unknown>) {
  Object.assign(form, row ?? { {{FormFields}} })
  dialogVisible.value = true
}

async function save() {
  const res = await http.post('/api/{{ApiRoute}}/add', form)
  if (res.status) {
    ElMessage.success('保存成功')
    dialogVisible.value = false
    await loadData()
  }
}

onMounted(loadData)
</script>

<style scoped>
.toolbar { display: flex; justify-content: space-between; align-items: center; }
</style>
